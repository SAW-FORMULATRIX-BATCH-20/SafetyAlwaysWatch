<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="floorGrid" width="60" height="40" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="safetyStripe" width="20" height="20" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="10" height="20" fill="#eab308" fill-opacity="0.25" />
      <rect x="10" width="10" height="20" fill="#0f172a" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Overhead industrial beams -->
  <path d="M 0 0 L 1280 0 L 1280 90 L 0 90 Z" fill="#0b1120" />
  <line x1="0" y1="90" x2="1280" y2="90" stroke="#334155" stroke-width="2" />
  <line x1="160" y1="0" x2="220" y2="90" stroke="#1e293b" stroke-width="3" />
  <line x1="400" y1="0" x2="460" y2="90" stroke="#1e293b" stroke-width="3" />
  <line x1="720" y1="0" x2="780" y2="90" stroke="#1e293b" stroke-width="3" />
  <line x1="1040" y1="0" x2="1100" y2="90" stroke="#1e293b" stroke-width="3" />

  <!-- Horizon / Wall & Floor division -->
  <polygon points="0,260 1280,260 1280,720 0,720" fill="#090f1d" />
  <rect y="260" width="1280" height="460" fill="url(#floorGrid)" />

  <!-- Industrial Perspective Grid -->
  <line x1="640" y1="260" x2="0" y2="720" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="640" y1="260" x2="320" y2="720" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
  <line x1="640" y1="260" x2="640" y2="720" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
  <line x1="640" y1="260" x2="960" y2="720" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
  <line x1="640" y1="260" x2="1280" y2="720" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Conveyor & Storage Equipment Silhouettes -->
  <rect x="80" y="210" width="220" height="150" rx="4" fill="#131c2e" stroke="#1e293b" stroke-width="2" />
  <rect x="95" y="230" width="190" height="20" rx="2" fill="#1e293b" />
  <rect x="95" y="260" width="190" height="80" rx="2" fill="#0f172a" />

  <!-- Heavy Machinery / Assembly Station -->
  <rect x="420" y="180" width="440" height="180" rx="6" fill="#111827" stroke="#1f2937" stroke-width="2" />
  <path d="M 450 180 L 490 130 L 790 130 L 830 180 Z" fill="#0d1525" stroke="#1f2937" stroke-width="1.5" />
  <circle cx="500" cy="240" r="28" fill="#1f2937" stroke="#374151" stroke-width="2" />
  <circle cx="500" cy="240" r="12" fill="#111827" />
  <circle cx="760" cy="240" r="28" fill="#1f2937" stroke="#374151" stroke-width="2" />
  <circle cx="760" cy="240" r="12" fill="#111827" />

  <!-- Storage Racks -->
  <rect x="980" y="160" width="220" height="260" fill="#0d1424" stroke="#1e293b" stroke-width="2" />
  <line x1="980" y1="220" x2="1200" y2="220" stroke="#334155" stroke-width="2" />
  <line x1="980" y1="290" x2="1200" y2="290" stroke="#334155" stroke-width="2" />
  <line x1="980" y1="360" x2="1200" y2="360" stroke="#334155" stroke-width="2" />
  <rect x="1000" y="180" width="70" height="35" rx="2" fill="#1e293b" />
  <rect x="1090" y="180" width="80" height="35" rx="2" fill="#334155" opacity="0.6" />
  <rect x="1000" y="245" width="85" height="40" rx="2" fill="#334155" opacity="0.6" />
  <rect x="1105" y="245" width="65" height="40" rx="2" fill="#1e293b" />

  <!-- Floor Safety Demarcation Lines -->
  <polygon points="360,380 920,380 980,520 300,520" fill="url(#safetyStripe)" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.8" />
  
  <!-- Subtle Walkway -->
  <polygon points="80,540 240,540 200,700 0,700" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Camera Reticle / HUD Elements -->
  <circle cx="640" cy="360" r="14" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4 2" opacity="0.5" />
  <line x1="610" y1="360" x2="670" y2="360" stroke="#475569" stroke-width="1" opacity="0.3" />
  <line x1="640" y1="330" x2="640" y2="390" stroke="#475569" stroke-width="1" opacity="0.3" />

  <path d="M 40 50 L 20 50 L 20 70" fill="none" stroke="#64748b" stroke-width="2" opacity="0.6" />
  <path d="M 1240 50 L 1260 50 L 1260 70" fill="none" stroke="#64748b" stroke-width="2" opacity="0.6" />
  <path d="M 40 670 L 20 670 L 20 650" fill="none" stroke="#64748b" stroke-width="2" opacity="0.6" />
  <path d="M 1240 670 L 1260 670 L 1260 650" fill="none" stroke="#64748b" stroke-width="2" opacity="0.6" />
</svg>
